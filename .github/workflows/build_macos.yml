name: Build Pro-Fi for macOS

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Universal (arm64 + x86_64)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Configure CMake (Universal Binary)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" \
            -DPROLOFI_FETCH_JUCE=ON \
            -DPROLOFI_COPY_AFTER_BUILD=OFF

      - name: Build Targets
        run: |
          cmake --build build --config Release --target ProLoFi_VST3 ProLoFi_AU ProLoFi_Standalone --parallel

      - name: Package macOS Universal Plugins
        run: |
          mkdir -p dist/Pro-Fi_macOS
          cp -R build/ProLoFi_artefacts/VST3/Pro-Fi.vst3 dist/Pro-Fi_macOS/
          cp -R build/ProLoFi_artefacts/AU/Pro-Fi.component dist/Pro-Fi_macOS/
          cp -R build/ProLoFi_artefacts/Standalone/Pro-Fi.app dist/Pro-Fi_macOS/
          cp README.md dist/Pro-Fi_macOS/
          cd dist
          zip -r -y Pro-Fi_v1.0.0_macOS_Universal.zip Pro-Fi_macOS

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Fi-macOS-Universal
          path: dist/Pro-Fi_v1.0.0_macOS_Universal.zip
          if-no-files-found: error

      - name: Publish Release Assets (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pro-Fi_v1.0.0_macOS_Universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
